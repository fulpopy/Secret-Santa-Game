<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Secret Santa Game</title>
  </head>
  <body>
    <div class="heading"><h1>Secret Santa Game</h1></div>
    <div class="container">
      <div class="container-one">
        <div>
          <form id="uploadForm">
            <label for="employees">Upload CSV file of employees :</label>
            <input
              type="file"
              id="employees"
              name="employees"
              accept=".csv"
              required
            />

            <label for="prev-year-secret-santa">
              Upload CSV file for previous year's Secret Santa (optional):
            </label>
            <input
              type="file"
              id="prev-year-secret-santa"
              name="prev-year-secret-santa"
              accept=".csv"
            />

            <div style="display: flex; justify-content: end">
              <button type="submit">Get Secret Santa</button>
            </div>
          </form>
          <a id="download-link" href="#" download="secret_santa_assignments.csv"
            >Download Result</a
          >
        </div>
      </div>
      <div class="container-two">
        <div id="placeholder-text">
          <p style="text-align: center">
            *Please upload CSV to see the results
          </p>
        </div>
      </div>
    </div>
    <script>
      document
        .getElementById("uploadForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData();
          formData.append(
            "employees",
            document.getElementById("employees").files[0]
          );

          if (
            document.getElementById("prev-year-secret-santa").files.length > 0
          ) {
            formData.append(
              "prev-year-secret-santa",
              document.getElementById("prev-year-secret-santa").files[0]
            );
          }

          const response = await fetch("/api/secret-santa", {
            method: "POST",
            body: formData,
          });

          if (response.ok) {
            const blob = await response.blob();
            const text = await blob.text(); // Convert to text to parse CSV

            // Display Download Link
            const downloadLink = document.getElementById("download-link");
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.style.display = "block";

            // Parse CSV and display in table
            displayAssignments(text);
          } else {
            alert("Error processing Secret Santa. Please try again.");
          }
        });

      function displayAssignments(csvText) {
        const rows = csvText.split("\n").map((row) => row.split(","));
        if (rows.length < 2) return;

        let table = `<table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
          <tr style="background-color: #007bff; color: white;">
            <th>Employee Name</th>
            <th>Employee Email</th>
            <th>Secret Child Name</th>
            <th>Secret Child Email</th>
          </tr>`;

        for (let i = 1; i < rows.length; i++) {
          if (rows[i].length < 4) continue; // Skip incomplete rows
          table += `<tr>
            <td>${rows[i][0]}</td>
            <td>${rows[i][1]}</td>
            <td>${rows[i][2]}</td>
            <td>${rows[i][3]}</td>
          </tr>`;
        }

        table += "</table>";

        const container = document.querySelector(".container-two");
        container.innerHTML = table;

        // Hide placeholder text
        document.getElementById("placeholder-text").style.display = "none";
      }
    </script>
  </body>
</html>
